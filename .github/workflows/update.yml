name: BPSC Countdown Automation

on:
  schedule:
    - cron: '17 */6 * * *'   # fallback safety net only, not the primary driver
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets GITHUB_TOKEN call workflow_dispatch to relaunch itself

concurrency:
  group: bpsc-countdown
  cancel-in-progress: false   # don't kill a running loop if a new trigger fires

jobs:
  run-countdown:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # stay under GitHub's 360min (6h) hard job cap
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run countdown script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: update.yml
        run: |
          python bpsc_countdown.py

      - name: Commit and push updated message ID
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update countdown message ID"
          file_pattern: last_msg_id.txt
