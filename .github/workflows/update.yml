name: BPSC Countdown Automation

on:
  schedule:
  - cron: '17 * * * *'
 # Runs every 1 hour
  workflow_dispatch:

jobs:
  run-countdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run countdown script
        env:
          BOT_TOKEN: "8880538925:AAFpfcBUHgpcDyHefbEeKUU8F4vH6cFqt0w"
          CHAT_ID: "@bpsc72countdown"
        run: |
          python bpsc_countdown.py

      - name: Commit and push updated message ID
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update countdown message ID"
          file_pattern: last_msg_id.txt
